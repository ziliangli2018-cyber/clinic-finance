name: Validate

on:
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Validate static demo build at a project subpath
        run: npm run build
        env:
          VITE_APP_ENV: demo
          VITE_DATA_MODE: mock
          VITE_BASE_PATH: /clinic-finance/
      - name: Validate production compilation without real backend credentials
        run: npm run build:production
        env:
          VITE_APP_ENV: production
          VITE_DATA_MODE: supabase
          VITE_BASE_PATH: /clinic-finance/
          VITE_SUPABASE_URL: https://ci-example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_build_placeholder
      - name: Rebuild demo for browser checks
        run: npm run build
        env:
          VITE_BASE_PATH: /clinic-finance/
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  backend:
    name: Database and Edge Function checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          package-manager-cache: false
      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.117.0
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.x
      - name: Check backend TypeScript
        run: deno task --config supabase/functions/deno.json check
      - name: Test backend provider guards
        run: deno task --config supabase/functions/deno.json test
      - name: Start isolated local backend and apply migrations
        run: supabase start
      - name: Check tenant isolation and database rules
        run: supabase test db
      - name: Stop local backend
        if: always()
        run: supabase stop --no-backup
